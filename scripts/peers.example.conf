# peers.example.conf
#
# One peer per line: name|as-set|extra-hosts
#
#   name          short identifier, used in the saved-filter description
#                 and in log output. No spaces.
#   as-set        the IRR as-set object representing this peer's
#                 customer cone (find it via bgp.he.net's IRR tab or
#                 https://irrexplorer.nlnog.net, searching the peer's ASN)
#   extra-hosts   comma-separated IRRd host(s) to check IN ADDITION to
#                 the script's defaults (whois.radb.net, whois.afrinic.net,
#                 rr.ntt.net) -- leave blank if the as-set is already
#                 reachable via one of those three. Only add a host here
#                 if you've confirmed (e.g. via bgp.he.net's IRR tab) that
#                 the as-set is registered somewhere else, such as RIPE,
#                 ALTDB, or APNIC.
#
# Peers with NO registered as-set aren't worth an entry here -- there's
# nothing in IRR to expand. Filter their bare ASN directly in Akvorado
# instead (e.g. `DstAS = 12345`).
#
# Copy this file to peers.conf and fill in your own peers -- peers.conf
# is meant to be private to your deployment (your peer list is your own
# network's info) and should NOT be committed if you're working in a
# shared or public repo clone.
#
# Lines starting with # and blank lines are ignored.

# example: a transit/ISP peer whose as-set is reachable via the defaults
example_transit_isp|AS-EXAMPLE-TRANSIT|

# example: a peer whose as-set is only registered in RIPE
example_ripe_peer|AS-SET-EXAMPLE|whois.ripe.net

# example: a peer whose as-set is only registered in ALTDB
example_altdb_peer|AS-EXAMPLE-CUSTOMERS|whois.altdb.net
